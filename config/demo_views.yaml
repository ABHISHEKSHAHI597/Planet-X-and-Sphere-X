# Demo views (workflow.md §12.4 "pinned fallbacks"; implementation.md §9 snapshot mode). Owner P.
# scripts/prewarm.py builds each against a running API, then the `extras` (derived products the demo script uses,
# implementation.md §9 and §11.4) whose capability is enabled there; scripts/make_snapshot.py packages the built views
# for the offline laptops. Every entry is pinned so the demo never depends on a live archive answer.
schema: parallax-demo-views@1
