# Feature flags (workflow.md §9.6). Owner P; release configuration changes need P's review (§9.4).
#
# level: the most public environment the capability may appear in
#   off      nowhere
#   dev      developer machines (ENVIRONMENT=local|mock)
#   staging  dev + staging, shown with an "unvalidated" badge (UX immaturity only, never a wrong result)
#   on       release (production, snapshot laptops). scripts/check_flags.py fails CI unless every
#            `requires` entry is `accepted` in validation/STATUS.md.
# requires: foundation checks (§5) and gates (§6) that must be accepted before `on`.
# Capability names match frontend/src/lib/features.ts CAPABILITIES (a missing name is OFF in the UI);
# `core: true` marks the P0 product, which the UI always shows (the API still gates it by level).
#
# 2026-11-08 (audit, improvements.md): every built capability is at least `dev`, so the local laptop shows it
# with the "unvalidated" badge. `dev` is not a release level; `on` still needs accepted evidence.
# 2026-11-07 (P): nothing is `on`: no gate is accepted yet (validation/STATUS.md). P0 capabilities run at
# `staging` so staging and the daily demo work; RC0 flips them to `on` only after G2 is accepted.
schema: parallax-features@1
flags:
  blink:        {core: true, level: "staging", capability: "Visit-stack blink, both viewers (P0-3, P0-8)", requires: [F2, F6, F8, F11, F14, G1, G2]}
  coverage:     {core: true, level: "staging", capability: "Coverage summary (P0-2)", requires: [F11, G1]}
  resolve:      {core: true, level: "staging", capability: "Resolver, aliases, epoch banner (P0-1)", requires: [G1]}
  pins:         {core: true, level: "staging", capability: "Pinned permalinks (P0-5)", requires: [F11, G1, G2]}
  flags_overlay: {core: true, level: "staging", capability: "Flags overlay and QA badges (P0-6)", requires: [F6, F8, G2]}
  freshness:    {level: "staging", capability: "Release freshness badge (P1-6, G5.eng)", requires: [G2, G5.eng]}
  embed:        {level: "staging", capability: "Embed route (P1-5, G5.eng)", requires: [G2, G5.eng]}
  aladin:       {level: "staging", capability: "Aladin Lite context (P1-4)", requires: [F14, G2]}
  track:        {level: "dev", capability: "Predicted track overlay (P1-3, G3)", requires: [F15, G3],
                 note: "M targets.pos installed; G3 real-target acceptance and I review still required"}
  overlays:     {level: "dev", capability: "Gaia/SIMBAD markers at the visit epoch (P1-4)", requires: [F15, G3]}
  # optimisation.md REL-5: AllWISE positions drawn as catalogued (≈2010.5), never propagated, so they do not wait on
  # G3's propagation; registration on the stack grid (G2) is all they rely on.
  wise_layer:   {level: "staging", capability: "AllWISE catalogue layer at its own epoch (O5)", requires: [G2]}
  astrometry:   {level: "dev", capability: "Astrometry card and fitted vector (P1-3, G3)", requires: [F5, F15, G3],
                 note: "M native astrometry installed; F5/F15/G3 acceptance pending"}
  # workflow.md §11.2: the difference mode stays off in every release until G4a is accepted.
  diff:         {level: "dev", capability: "λ-matched difference (P1-1, G4a)", requires: [F1, F2, F3, F16, G4a]}
  spectrum:     {level: "dev", capability: "Spectra on the fly (P1-2, G4b)", requires: [F1, F4, F5, F13, G4b],
                 note: "M forced blend photometry installed; F4/F5/G4b acceptance pending"}
  bright_fill:  {level: "dev", capability: "Model-filled bright cores (P1-7)", requires: [F5, F7, G2],
                 note: "M FittedPSF and display-only fill integrated; F5 and independent review pending"}
  blink25:      {level: "dev", capability: "25-year blink (P2-1, G5.25yr)", requires: [G2, G5.25yr],
                 note: "server-side epochs (2MASS, AllWISE, NEOWISE, SPHEREx) built 2026-11-08; G5.25yr L3 review pending"}
  flip:         {level: "dev", capability: "Spectral flipbook (P2-2, G5.flip)", requires: [F1, F3, F16, G4a, G5.flip]}
  scrubber:     {level: "dev", capability: "λ-scrubber (P2-2, G5.flip)", requires: [F1, F3, F16, G4a, G5.flip]}
  rgb:          {level: "dev", capability: "RGB composites of band stacks", requires: [G2]}
  lightcurve:   {level: "dev", capability: "Light curves (P2-3, G5.lc)", requires: [F3, F4, G4b, G5.lc],
                 note: "M relative curves installed; G5.lc real period and AAVSO acceptance pending"}
  movers:       {level: "dev", capability: "Mover finder (P2-4, G5.movers)", requires: [G3, G5.movers]}
  planetx:      {level: "dev", capability: "Parallax-linked orphan candidates (P2-6)", requires: [G5.movers, G5.sso, G5.planetx]}
  export:       {level: "staging", capability: "Exports (P2-7, G5.eng)", requires: [G2, G5.eng]}
  candidates:   {level: "staging", capability: "Candidate reports (P2-9, G5.eng)", requires: [G2, G5.eng]}
  sso:          {level: "dev", capability: "Solar System track mode (P2-10, G5.sso)", requires: [F10, G4b, G5.sso],
                 note: "M Horizons/track implementation installed; F10 review and real Pluto spectrum still required"}
